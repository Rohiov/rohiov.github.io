<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Empresa - SWCORA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-sm">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html"><i class="bi bi-lightning-charge-fill"></i> SWCORA</a>
                <div class="navbar-collapse collapse d-sm-inline-flex justify-content-between">
                    <ul class="navbar-nav flex-grow-1">
                        <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-door"></i> Inicio</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-pencil"></i> Editar Empresa: XEROX</h2>
            <a href="admin-empresas.html" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Código</label>
                        <input type="text" class="form-control" value="EMP-001" readonly>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">Nombre <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" value="XEROX, S.A. DE C.V." required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Contacto</label>
                        <input type="text" class="form-control" value="Juan Hernández">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Tipo de Empresa <span class="text-danger">*</span></label>
                        <div class="select-with-action">
                            <select class="form-select" id="selectTipoEmpresa" required>
                                <option value="1" selected>Proveedor</option>
                                <option value="2">Cliente</option>
                                <option value="3">Filial</option>
                                <option value="4">Interno</option>
                            </select>
                            <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#modalTiposEmpresa">
                                <i class="bi bi-list"></i> Ver todos
                            </button>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="esActivo" checked>
                            <label class="form-check-label" for="esActivo">Empresa activa</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-3">
            <a href="admin-empresas.html" class="btn btn-outline-secondary">Cancelar</a>
            <button class="btn btn-primary"><i class="bi bi-save"></i> Guardar Cambios</button>
        </div>
    </div>

    <!-- Modal Ver Todos los Tipos -->
    <div class="modal fade" id="modalTiposEmpresa" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header" style="background-color: var(--cora-accent); color: white;">
                    <h5 class="modal-title"><i class="bi bi-tags"></i> Tipos de Empresa</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="d-flex justify-content-between mb-3">
                        <input type="text" class="form-control me-2" placeholder="Buscar tipo...">
                        <button class="btn btn-primary"><i class="bi bi-plus-circle"></i> Agregar Nuevo Tipo</button>
                    </div>
                    <table class="table table-hover">
                        <thead>
                            <tr><th>Nombre</th><th>Estado</th><th class="text-center">Acciones</th></tr>
                        </thead>
                        <tbody>
                            <tr><td>Proveedor</td><td><span class="badge bg-success">Activo</span></td><td class="text-center"><button class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></button></td></tr>
                            <tr><td>Cliente</td><td><span class="badge bg-success">Activo</span></td><td class="text-center"><button class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></button></td></tr>
                            <tr><td>Filial</td><td><span class="badge bg-success">Activo</span></td><td class="text-center"><button class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></button></td></tr>
                            <tr><td>Interno</td><td><span class="badge bg-success">Activo</span></td><td class="text-center"><button class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></button></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container text-center">
            &copy; 2026 SWCORA - Sistema Web de Control de Recursos y Activos | v1.0.0
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scripts.js"></script>
</body>
</html>
